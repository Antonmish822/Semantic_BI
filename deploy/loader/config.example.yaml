s3:
  bucket: "your-bucket"
  portal_id: "garpix-bitrix24-ru"
  endpoint_url: "https://storage.yandexcloud.net"
  region: "ru-central1"
  access_key: "YOUR_S3_ACCESS_KEY_ID"
  secret_key: "YOUR_S3_SECRET_ACCESS_KEY"
mapping:
  registry_path: "/app/mappings/bitrix24/registry.json"
  schemas_root: "/app/mappings/bitrix24"
checkpoint:
  path: "/var/lib/semantic-bi/state.sqlite3"
  # strict downloads and SHA-256 checks every event; fast skips event bodies
  # only when the checkpoint already contains the exact manifest event.
  resume_mode: strict
backend: fuseki
fuseki:
  url: "http://host.docker.internal:3030/cccr"
  username: ""
  password: ""
  timeout_seconds: 90
  graph_namespace: "urn:bitrix24:entity"
# For GraphDB, set backend: graphdb and use a separate checkpoint path/volume.
# graphdb:
#   url: "http://graphdb:7200"
#   repository: "your-repository"
#   username: ""
#   password: ""
#   timeout_seconds: 90
#   graph_namespace: "urn:bitrix24:entity"
snapshot_reconcile_entity_types: [deal, user, category, stage, source]
poll_interval_seconds: 60

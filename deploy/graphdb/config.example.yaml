s3:
  bucket: "your-bucket"
  portal_id: "garpix-bitrix24-ru"
  endpoint_url: "https://storage.yandexcloud.net"
  region: "ru-central1"
  access_key: "YOUR_S3_ACCESS_KEY_ID"
  secret_key: "YOUR_S3_SECRET_ACCESS_KEY"
mapping:
  registry_path: "/app/mappings/bitrix24/registry.json"
  schemas_root: "/app/mappings/bitrix24"
checkpoint:
  path: "/var/lib/semantic-bi/state.sqlite3"
backend: graphdb
graphdb:
  url: "http://graphdb:7200"
  repository: "fuseki_migration_monitor"
  username: ""
  password: ""
  # Необязательно: отдельная GraphDB-учётная запись администратора для Recovery API.
  # Если security включена, при пустых backup_* используются username/password выше.
  # При отключённой GraphDB security можно оставить все эти поля пустыми.
  backup_username: ""
  backup_password: ""
  timeout_seconds: 90
  graph_namespace: "urn:bitrix24:entity"
snapshot_reconcile_entity_types: [deal, user, category, stage, source]
poll_interval_seconds: 60

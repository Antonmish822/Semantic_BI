[build-system]
requires = [
  "scikit-build-core>=0.10",
]
build-backend = "scikit_build_core.build"

[project]
name = "cccr-py"
version = "0.1.0"
description = "CCCR engine Python bindings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "See repository" }

[project.optional-dependencies]
# Empty; native deps (SaxonC-HE, Redland) are resolved by CMake at build time.

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
wheel.packages = []
wheel.install-dir = "."
build-dir = "build/skbuild/{wheel_tag}"
# Build only the extension (and its deps); install the default component.
build.targets = ["cccr_py"]

[tool.scikit-build.cmake.define]
CCCR_BUILD_CLI = "OFF"
CCCR_BUILD_TESTS = "OFF"
CCCR_BUILD_EXAMPLES = "OFF"
CCCR_BUILD_BINDINGS_C = "OFF"
CCCR_BUILD_BINDINGS_PYTHON = "ON"
CCCR_ENABLE_INSTALL = "OFF"

name: Loader runtime
on:
  pull_request:
jobs:
  loader-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image with release wheel and test runtime
        run: docker build --platform linux/amd64 -f deploy/loader/Dockerfile -t semantic-bi-loader:ci .
      - name: Check entrypoint
        run: docker run --rm semantic-bi-loader:ci --help

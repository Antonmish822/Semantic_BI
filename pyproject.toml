[project]
name = "semantic-bi-loader"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["boto3>=1.34,<2", "PyYAML>=6,<7", "requests>=2.31,<3", "cccr-py==0.1.0"]

[dependency-groups]
build = ["scikit-build-core==0.11.6", "auditwheel>=6,<7", "patchelf>=0.17,<1"]

[tool.uv]
package = false
required-version = "==0.9.10"
build-constraint-dependencies = ["scikit-build-core==0.11.6"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
cccr-py = { path = "cccr_engine" }
